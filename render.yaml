services:
  - type: web
    name: nativego
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    envVars:
      - key: NATIVEGO_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
