{% extends "base.html" %}{% block t %}Log in{% endblock %}{% block c %}
<div class="wrap">
<div class="narrow">
<h2>Log in</h2>
<form method="post" action="{{ url_for('login', next=request.args.get('next','')) }}" class="form">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label>Email<input name="email" type="email" required autocomplete="email"></label>
  <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
  <button class="btn" type="submit">Log in</button>
</form>
<p class="muted center">No account? <a href="{{ url_for('signup') }}">Sign up</a></p>
<p class="fineprint">By continuing you agree to our <a href="{{ url_for('terms') }}">Terms of Service</a> and <a href="{{ url_for('privacy') }}">Privacy Policy</a>.</p>
</div>
</div>
{% endblock %}
