{% extends "base.html" %}{% block t %}{{ code }} · {{ title }}{% endblock %}{% block c %}
<div class="wrap">
  <div class="page-head">
    <h1>{{ code }} — {{ title }}</h1>
    <p>{{ message }}</p>
    <p style="margin-top:22px">
      <a class="btn" href="{{ url_for('index') }}">Back to home</a>
      {% if code == 403 or code == 404 %}
      <a class="btn ghost" href="{{ url_for('discover') }}">Browse providers</a>
      {% endif %}
    </p>
  </div>
</div>
{% endblock %}
